<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="arm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#98e0f8"/><stop offset="0.5" stop-color="#18a0d8"/><stop offset="1" stop-color="#0868b0"/>
    </linearGradient>
    <linearGradient id="vg" gradientUnits="userSpaceOnUse" x1="0" y1="-250" x2="0" y2="250"><stop offset="0" stop-color="#18a0d8"/><stop offset="1" stop-color="#0868b0"/></linearGradient>
    <radialGradient id="disc" cx="50%" cy="40%" r="65%">
      <stop offset="0" stop-color="#d4f3fd"/><stop offset="1" stop-color="#58c8f0"/>
    </radialGradient>
    <g id="branch">
      <rect x="-32" y="-480" width="64" height="380" rx="32" fill="url(#arm)"/>
      <path d="M0 -400 L-120 -470 M0 -400 L120 -470 M0 -295 L-95 -365 M0 -295 L95 -365" stroke="url(#arm)" stroke-width="52" stroke-linecap="round" fill="none"/>
    </g>
  </defs>
  <g transform="translate(512 512)">
    <use href="#branch"/>
    <use href="#branch" transform="rotate(60)"/>
    <use href="#branch" transform="rotate(120)"/>
    <use href="#branch" transform="rotate(180)"/>
    <use href="#branch" transform="rotate(240)"/>
    <use href="#branch" transform="rotate(300)"/>
    <polygon points="0,-108 83,-143 94,-54 166,0 94,54 83,143 0,108 -83,143 -94,54 -166,0 -94,-54 -83,-143" fill="url(#disc)" stroke="url(#disc)" stroke-width="10" stroke-linejoin="round"/>
    <g fill="none" stroke="url(#vg)" stroke-width="46" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-100 -208 L0 -150 L100 -208" transform="rotate(0)"/>
      <path d="M-100 -208 L0 -150 L100 -208" transform="rotate(60)"/>
      <path d="M-100 -208 L0 -150 L100 -208" transform="rotate(120)"/>
      <path d="M-100 -208 L0 -150 L100 -208" transform="rotate(180)"/>
      <path d="M-100 -208 L0 -150 L100 -208" transform="rotate(240)"/>
      <path d="M-100 -208 L0 -150 L100 -208" transform="rotate(300)"/>
      </g>
    <!-- penguin head, profile facing right (original design) -->
