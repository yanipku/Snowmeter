      <ellipse cx="-4" cy="2" rx="108" ry="118" fill="#06284d"/>
      <path d="M30 -92 C78 -80 100 -40 98 4 C96 62 56 104 8 104 C-14 70 -14 10 -4 -40 C0 -70 12 -88 30 -92Z" fill="#e8f8ff"/>
